<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Where SWE-RL training tasks come from</title>
  <desc id="desc">Real fixes, software history, and synthetic bugs become tasks in an isolated repo; a code agent writes patches, a test verifier produces rewards, and the policy updates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 16; }
      .source { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 14; }
      .train { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 16; }
      .warn { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 14; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 650 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    </style>
  </defs>

  <text x="520" y="38" text-anchor="middle" class="title">From software history to one SWE-RL update</text>

  <rect x="35" y="78" width="225" height="98" class="source"/>
  <text x="147" y="112" text-anchor="middle" class="label">Real issues and PRs</text>
  <text x="147" y="140" text-anchor="middle" class="small">SWE-bench: real eval</text>

  <rect x="35" y="214" width="225" height="98" class="source"/>
  <text x="147" y="248" text-anchor="middle" class="label">Software history</text>
  <text x="147" y="276" text-anchor="middle" class="small">SWE-RL: recovered signal</text>

  <rect x="35" y="350" width="225" height="98" class="source"/>
  <text x="147" y="384" text-anchor="middle" class="label">Synthetic bugs / self-play</text>
  <text x="147" y="412" text-anchor="middle" class="small">SWE-smith and SSR</text>

  <path d="M260 127 C315 127, 305 222, 355 222" class="line"/>
  <path d="M260 263 L355 263" class="line"/>
  <path d="M260 399 C315 399, 305 304, 355 304" class="line"/>

  <rect x="355" y="177" width="210" height="170" class="box"/>
  <text x="460" y="214" text-anchor="middle" class="label">Standardized tasks</text>
  <text x="460" y="248" text-anchor="middle" class="small">repo snapshot + issue</text>
  <text x="460" y="276" text-anchor="middle" class="small">isolated env + tests</text>
  <text x="460" y="304" text-anchor="middle" class="small">unified state-action logs</text>

  <path d="M565 262 L630 262" class="line"/>

  <rect x="630" y="177" width="175" height="170" class="train"/>
  <text x="718" y="214" text-anchor="middle" class="label">Agent rollout</text>
  <text x="718" y="248" text-anchor="middle" class="small">read · search · edit</text>
  <text x="718" y="276" text-anchor="middle" class="small">run tests · revise</text>
  <text x="718" y="304" text-anchor="middle" class="small">submit patch</text>

  <path d="M805 262 L870 262" class="line"/>

  <rect x="870" y="177" width="135" height="170" class="warn"/>
  <text x="938" y="214" text-anchor="middle" class="label">Verifier</text>
  <text x="938" y="248" text-anchor="middle" class="small">apply patch</text>
  <text x="938" y="276" text-anchor="middle" class="small">run tests</text>
  <text x="938" y="304" text-anchor="middle" class="small">reward + logs</text>

  <path d="M938 347 C938 500, 718 500, 718 365" class="line"/>
  <text x="828" y="532" text-anchor="middle" class="small">Updated policy samples the next batch</text>

  <rect x="355" y="395" width="450" height="68" class="box"/>
  <text x="580" y="423" text-anchor="middle" class="label" style="font-size:16px">Guardrail: read-only eval tests; log env errors apart</text>
  <text x="580" y="449" text-anchor="middle" class="small">no test deletion, skipped runs, or env failure as progress</text>
</svg>
