<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d"><title id="t">From direct generation to reasoning models</title><desc id="d">Direct generation lets early errors propagate; a reasoning model lists conditions and candidate methods, then checks, revises, and answers.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 18px Inter,Helvetica,Arial,sans-serif;fill:#202936}.s{font:14px Inter,Helvetica,Arial,sans-serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect x="35" y="80" width="130" height="80" rx="12" class="b"/><text x="100" y="127" text-anchor="middle" class="t">Problem</text><rect x="215" y="35" width="215" height="80" rx="12" class="b"/><text x="322" y="68" text-anchor="middle" class="t">Direct generation</text><text x="322" y="94" text-anchor="middle" class="s">early errors propagate</text><rect x="215" y="145" width="215" height="80" rx="12" class="c"/><text x="322" y="178" text-anchor="middle" class="t">Reasoning model</text><text x="322" y="204" text-anchor="middle" class="s">lists conditions, tries methods</text><rect x="500" y="145" width="190" height="80" rx="12" class="c"/><text x="595" y="178" text-anchor="middle" class="t">Check and revise</text><text x="595" y="204" text-anchor="middle" class="s">switch path on error</text><rect x="760" y="80" width="190" height="80" rx="12" class="b"/><text x="855" y="127" text-anchor="middle" class="t">Final answer</text><path d="M165 120 215 75M165 120 215 185M430 185H500M690 185 760 130M430 75 760 110" class="a"/></svg>
