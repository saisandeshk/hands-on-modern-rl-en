<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d"><title id="t">R1-Zero training loop</title><desc id="d">A base model samples a group of answers per problem, rules check answers and format, and within-group advantages feed the GRPO update.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 17px Inter,Helvetica,Arial,sans-serif;fill:#202936}.s{font:14px Inter,Helvetica,Arial,sans-serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}.r{stroke:#9a6a28;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect x="30" y="65" width="165" height="95" rx="12" class="b"/><text x="112" y="105" text-anchor="middle" class="t">Base model</text><text x="112" y="133" text-anchor="middle" class="s">no CoT warm start</text><rect x="240" y="65" width="190" height="95" rx="12" class="c"/><text x="335" y="104" text-anchor="middle" class="t">Group sampling</text><text x="335" y="133" text-anchor="middle" class="s">G answers per problem</text><rect x="475" y="65" width="190" height="95" rx="12" class="b"/><text x="570" y="104" text-anchor="middle" class="t">Rule-based check</text><text x="570" y="133" text-anchor="middle" class="s">correctness + format</text><rect x="710" y="65" width="230" height="95" rx="12" class="c"/><text x="825" y="104" text-anchor="middle" class="t">Advantage + GRPO update</text><text x="825" y="133" text-anchor="middle" class="s">upweight high-reward traces</text><path d="M195 112H240M430 112H475M665 112H710" class="a"/><path d="M825 160V215H335V161" class="r"/><text x="580" y="238" text-anchor="middle" class="s">updated policy keeps sampling</text></svg>
