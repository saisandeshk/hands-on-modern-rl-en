<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t d"><title id="t">Three test-time compute options</title><desc id="d">With weights fixed, sample in parallel, revise sequentially, or search over intermediate steps, then verify or aggregate into an answer.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 17px Inter,Helvetica,Arial,sans-serif;fill:#202936}.s{font:14px Inter,Helvetica,Arial,sans-serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect x="30" y="85" width="170" height="85" rx="12" class="b"/><text x="115" y="120" text-anchor="middle" class="t">Fixed weights</text><text x="115" y="146" text-anchor="middle" class="s">more inference budget</text><rect x="285" y="20" width="210" height="65" rx="12" class="c"/><text x="390" y="59" text-anchor="middle" class="t">Sample in parallel</text><rect x="285" y="98" width="210" height="65" rx="12" class="c"/><text x="390" y="137" text-anchor="middle" class="t">Revise sequentially</text><rect x="285" y="176" width="210" height="65" rx="12" class="c"/><text x="390" y="215" text-anchor="middle" class="t">Search over steps</text><rect x="680" y="85" width="250" height="85" rx="12" class="b"/><text x="805" y="120" text-anchor="middle" class="t">Verify, select, aggregate</text><text x="805" y="146" text-anchor="middle" class="s">turn extra compute into accuracy</text><path d="M200 127 285 52M200 127H285M200 127 285 208M495 52 680 110M495 130H680M495 208 680 145" class="a"/></svg>
