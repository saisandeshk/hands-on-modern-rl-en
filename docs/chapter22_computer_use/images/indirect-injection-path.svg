<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Indirect prompt-injection path and blockers</title>
  <desc id="desc">A hidden instruction in a PDF flows through model planning into tool calls; content boundaries, action gating, and high-risk confirmation can block it.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a52a2a"/></marker>
  </defs>
  <g font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#202124">
    <g stroke-width="2">
      <rect x="30" y="60" width="205" height="100" rx="14" fill="#f5f8ff" stroke="#2457a7"/>
      <rect x="285" y="60" width="205" height="100" rx="14" fill="#fff6f6" stroke="#a52a2a"/>
      <rect x="540" y="60" width="205" height="100" rx="14" fill="#fafafa" stroke="#555"/>
      <rect x="795" y="60" width="285" height="100" rx="14" fill="#fff6f6" stroke="#a52a2a"/>
    </g>
    <g font-size="21">
      <text x="133" y="98">User goal</text>
      <text x="388" y="98">Untrusted PDF</text>
      <text x="643" y="98">Model action</text>
      <text x="938" y="98">Email / files / payments</text>
    </g>
    <g font-size="16" fill="#555">
      <text x="133" y="128">"Summarize this file"</text>
      <text x="388" y="124">text + "forward it"</text>
      <text x="643" y="128">send_email(...)</text>
      <text x="938" y="128">real-world side effects</text>
    </g>

    <g fill="none" stroke="#a52a2a" stroke-width="2.4" marker-end="url(#redarrow)">
      <path d="M235 110 H275"/>
      <path d="M490 110 H530"/>
      <path d="M745 110 H785"/>
    </g>

    <g stroke="#2457a7" fill="#f5f8ff" stroke-width="2">
      <rect x="170" y="265" width="235" height="105" rx="14"/>
      <rect x="445" y="265" width="235" height="105" rx="14"/>
      <rect x="720" y="265" width="235" height="105" rx="14"/>
    </g>
    <g font-size="20">
      <text x="288" y="301" style="font-size:18px">Block 1: content boundary</text>
      <text x="563" y="301" style="font-size:18px">Block 2: action gating</text>
      <text x="838" y="301" style="font-size:18px">Block 3: user confirmation</text>
    </g>
    <g font-size="16" fill="#555">
      <text x="288" y="331">PDF supplies data only</text>
      <text x="288" y="354">never widens the user goal</text>
      <text x="563" y="331">check action and permission</text>
      <text x="563" y="354">deny cross-app overreach</text>
      <text x="838" y="331">before send / delete / pay</text>
      <text x="838" y="354">show concrete side effects</text>
    </g>
    <g fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)">
      <path d="M388 170 V255"/>
      <path d="M643 170 L585 255"/>
      <path d="M938 170 L855 255"/>
    </g>
  </g>
</svg>
