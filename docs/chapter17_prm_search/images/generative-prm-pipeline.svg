<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="t d"><title id="t">How a generative PRM judges</title><desc id="d">A generative PRM reads the problem and steps, writes its check, points at the error location, then outputs an extractable verdict for ranking or search.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 17px Inter,Helvetica,Arial,sans-serif;fill:#202936}.s{font:14px Inter,Helvetica,Arial,sans-serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect x="25" y="70" width="190" height="85" rx="12" class="b"/><text x="120" y="105" text-anchor="middle" class="t">Problem + step</text><text x="120" y="132" text-anchor="middle" class="s">with prior context</text><rect x="265" y="70" width="190" height="85" rx="12" class="c"/><text x="360" y="105" text-anchor="middle" class="t">Write a critique</text><text x="360" y="132" text-anchor="middle" class="s">recompute and cite rules</text><rect x="505" y="70" width="210" height="85" rx="12" class="c"/><text x="610" y="105" text-anchor="middle" class="t">Locate the error</text><text x="610" y="132" text-anchor="middle" class="s">keep NL rationale</text><rect x="765" y="70" width="210" height="85" rx="12" class="b"/><text x="870" y="105" text-anchor="middle" class="t">Final judgment</text><text x="870" y="132" text-anchor="middle" class="s">for rerank, search, debug</text><path d="M215 112H265M455 112H505M715 112H765" class="a"/></svg>
