<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="t d"><title id="t">Discriminative PRM data and use pipeline</title><desc id="d">Problems and reasoning prefixes are split into steps and labeled, train a classification judge, and output class probabilities for reranking or reinforcement learning.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 16px Inter,Helvetica,Arial,sans-serif;fill:#202936}.s{font:13px Inter,Helvetica,Arial,sans-serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect x="20" y="70" width="155" height="85" rx="12" class="b"/><text x="97" y="105" text-anchor="middle" class="t">Problem + prefix</text><text x="97" y="132" text-anchor="middle" class="s">keep the context</text><rect x="210" y="70" width="130" height="85" rx="12" class="b"/><text x="275" y="119" text-anchor="middle" class="t">Step splitting</text><rect x="375" y="70" width="145" height="85" rx="12" class="b"/><text x="447" y="105" text-anchor="middle" class="t">Step labels</text><text x="447" y="132" text-anchor="middle" class="s">human or auto</text><rect x="555" y="70" width="165" height="85" rx="12" class="c"/><text x="637" y="105" text-anchor="middle" class="t">Train classifier</text><text x="637" y="132" text-anchor="middle" class="s">cross-entropy loss</text><rect x="755" y="70" width="220" height="85" rx="12" class="c"/><text x="865" y="105" text-anchor="middle" class="t">Class probabilities</text><text x="865" y="132" text-anchor="middle" class="s">rerank or RL step reward</text><path d="M175 112H210M340 112H375M520 112H555M720 112H755" class="a"/></svg>
