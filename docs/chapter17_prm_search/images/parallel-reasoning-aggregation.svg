<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="t d"><title id="t">Parallel reasoning and aggregation</title><desc id="d">One problem is solved along several independent paths in parallel; answers are then normalized and combined by voting, a verifier, or a coordinator.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 16px Inter,Helvetica,Arial,sans-serif;fill:#202936}.s{font:13px Inter,Helvetica,Arial,sans-serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect x="25" y="85" width="150" height="85" rx="12" class="b"/><text x="100" y="134" text-anchor="middle" class="t">One problem</text><rect x="235" y="15" width="150" height="55" rx="10" class="c"/><text x="310" y="49" text-anchor="middle" class="t">Path 1</text><rect x="235" y="77" width="150" height="55" rx="10" class="c"/><text x="310" y="111" text-anchor="middle" class="t">Path 2</text><rect x="235" y="139" width="150" height="55" rx="10" class="c"/><text x="310" y="173" text-anchor="middle" class="t">Path 3</text><rect x="235" y="201" width="150" height="55" rx="10" class="c"/><text x="310" y="235" text-anchor="middle" class="t">Path 4</text><rect x="485" y="85" width="195" height="85" rx="12" class="b"/><text x="582" y="120" text-anchor="middle" class="t">Normalize + aggregate</text><text x="582" y="147" text-anchor="middle" class="s">merge equivalents first</text><rect x="780" y="75" width="195" height="105" rx="12" class="c"/><text x="877" y="108" text-anchor="middle" class="t">Final output</text><text x="877" y="137" text-anchor="middle" class="s">majority vote / verifier</text><text x="877" y="160" text-anchor="middle" class="s">or coordinator model</text><path d="M175 127 235 42M175 127 235 104M175 127 235 166M175 127 235 228M385 42 485 105M385 104 485 120M385 166 485 135M385 228 485 150M680 127H780" class="a"/></svg>
