<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t d"><title id="t">Formal verification pipeline</title><desc id="d">A word problem is first translated into a formal claim, the model writes a Lean proof, the kernel checks it and returns a binary reward; translation faithfulness needs a separate check.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.g{fill:#fff8eb;stroke:#a9772e;stroke-width:1.7}.t{font:600 16px Inter,Helvetica,Arial,sans-serif;fill:#202936}.s{font:13px Inter,Helvetica,Arial,sans-serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}.r{stroke:#9a6a28;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect x="25" y="65" width="165" height="85" rx="12" class="b"/><text x="107" y="114" text-anchor="middle" class="t">Problem in words</text><rect x="230" y="65" width="165" height="85" rx="12" class="c"/><text x="312" y="101" text-anchor="middle" class="t">Formal statement</text><text x="312" y="128" text-anchor="middle" class="s">Lean / Coq / Isabelle</text><rect x="435" y="65" width="180" height="85" rx="12" class="b"/><text x="525" y="101" text-anchor="middle" class="t">Draft proof</text><text x="525" y="128" text-anchor="middle" class="s">tactics and subgoals</text><rect x="655" y="65" width="155" height="85" rx="12" class="c"/><text x="732" y="101" text-anchor="middle" class="t">Kernel check</text><text x="732" y="128" text-anchor="middle" class="s">fixed formal rules</text><rect x="850" y="65" width="125" height="85" rx="12" class="b"/><text x="912" y="101" text-anchor="middle" class="t">Reward</text><text x="912" y="128" text-anchor="middle" class="s">accept 1 / reject 0</text><rect x="180" y="195" width="330" height="45" rx="10" class="g"/><text x="345" y="223" text-anchor="middle" class="s">formal claim must match the original problem</text><path d="M190 107H230M395 107H435M615 107H655M810 107H850" class="a"/><path d="M312 150V195" class="r"/></svg>
