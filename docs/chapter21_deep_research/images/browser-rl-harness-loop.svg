<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Browser RL Harness training loop</title>
  <desc id="desc">A research question goes to an agent, which interacts with the environment via search, page opens, and saved evidence; a verifier checks answers and citations, and a trainer updates the policy with rewards.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:16}
      .agent{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:16}
      .env{fill:#f0fdf4;stroke:#22c55e;stroke-width:2;rx:16}
      .verify{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:16}
      .line{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}
      .title{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .label{font:650 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
    </style>
  </defs>
  <text x="540" y="38" text-anchor="middle" class="title">Browser RL Harness: web interaction as trainable trajectories</text>

  <rect x="30" y="205" width="165" height="115" class="box"/>
  <text x="112" y="244" text-anchor="middle" class="label">Research question</text>
  <text x="112" y="274" text-anchor="middle" class="small">task, budget, format</text>

  <path d="M195 262 L260 262" class="line"/>

  <rect x="260" y="165" width="205" height="195" class="agent"/>
  <text x="362" y="205" text-anchor="middle" class="label">Research agent</text>
  <text x="362" y="240" text-anchor="middle" class="small">propose queries</text>
  <text x="362" y="270" text-anchor="middle" class="small">pick pages</text>
  <text x="362" y="300" text-anchor="middle" class="small">save evidence</text>
  <text x="362" y="330" text-anchor="middle" class="small">submit answer</text>

  <path d="M465 225 C535 170, 575 170, 640 225" class="line"/>
  <text x="553" y="174" text-anchor="middle" class="small">actions: search / open / click</text>

  <rect x="640" y="145" width="205" height="235" class="env"/>
  <text x="742" y="185" text-anchor="middle" class="label">Web environment</text>
  <text x="742" y="222" text-anchor="middle" class="small">search API</text>
  <text x="742" y="252" text-anchor="middle" class="small">text extraction</text>
  <text x="742" y="282" text-anchor="middle" class="small">Playwright browser</text>
  <text x="742" y="326" text-anchor="middle" class="small">cache · timeout · retry</text>
  <text x="742" y="350" text-anchor="middle" class="small">snapshots and error codes</text>

  <path d="M640 305 C575 355, 530 355, 465 305" class="line"/>
  <text x="553" y="382" text-anchor="middle" class="small">obs: results, text, screenshots, tool errors</text>

  <path d="M845 262 L900 262" class="line"/>

  <rect x="900" y="165" width="150" height="195" class="verify"/>
  <text x="975" y="205" text-anchor="middle" class="label">Verifier</text>
  <text x="975" y="240" text-anchor="middle" class="small">answer correctness</text>
  <text x="975" y="270" text-anchor="middle" class="small">citation support</text>
  <text x="975" y="300" text-anchor="middle" class="small">steps and cost</text>
  <text x="975" y="330" text-anchor="middle" class="small">reward + logs</text>

  <path d="M975 360 C975 492, 362 492, 362 378" class="line"/>
  <text x="670" y="525" text-anchor="middle" class="small">Trainer upweights high-reward traces, then samples new questions</text>
</svg>
