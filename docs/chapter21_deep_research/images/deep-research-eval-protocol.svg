<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">A reproducible Deep Research eval pipeline</title>
  <desc id="desc">Freeze questions, fix the environment and budget, run the agent and save traces and page snapshots, then score answers, evidence, process, cost, and reliability separately.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:16}
      .blue{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:16}
      .green{fill:#f0fdf4;stroke:#22c55e;stroke-width:2;rx:16}
      .orange{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:16}
      .line{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}
      .title{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .label{font:650 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
    </style>
  </defs>
  <text x="540" y="40" text-anchor="middle" class="title">A reproducible Deep Research eval pipeline</text>

  <rect x="30" y="110" width="200" height="150" class="blue"/>
  <text x="130" y="150" text-anchor="middle" class="label">1. Freeze tasks</text>
  <text x="130" y="185" text-anchor="middle" class="small">questions + aliases</text>
  <text x="130" y="215" text-anchor="middle" class="small">reference evidence, dates</text>
  <text x="130" y="240" text-anchor="middle" class="small">train / test split</text>

  <path d="M230 185 L280 185" class="line"/>

  <rect x="280" y="110" width="200" height="150" class="box"/>
  <text x="380" y="150" text-anchor="middle" class="label">2. Fix conditions</text>
  <text x="380" y="185" text-anchor="middle" class="small">search + browser versions</text>
  <text x="380" y="215" text-anchor="middle" class="small">tool permissions</text>
  <text x="380" y="240" text-anchor="middle" class="small">steps · tokens · time</text>

  <path d="M480 185 L530 185" class="line"/>

  <rect x="530" y="110" width="200" height="150" class="green"/>
  <text x="630" y="150" text-anchor="middle" class="label">3. Run trajectories</text>
  <text x="630" y="185" text-anchor="middle" class="small">search · open · read</text>
  <text x="630" y="215" text-anchor="middle" class="small">save page snapshots</text>
  <text x="630" y="240" text-anchor="middle" class="small">submit answers + cites</text>

  <path d="M730 185 L780 185" class="line"/>

  <rect x="780" y="110" width="270" height="150" class="orange"/>
  <text x="915" y="150" text-anchor="middle" class="label">4. Score by layer</text>
  <text x="915" y="185" text-anchor="middle" class="small">answer · cites · process</text>
  <text x="915" y="215" text-anchor="middle" class="small">cost · reliability</text>
  <text x="915" y="240" text-anchor="middle" class="small">keep subscores + reasons</text>

  <rect x="180" y="350" width="720" height="125" class="box"/>
  <text x="540" y="390" text-anchor="middle" class="label">Failure atlas: split the score into fixable issues</text>
  <text x="540" y="425" text-anchor="middle" class="small">missing page · bad extraction · reasoning error · citation drift · over budget · env noise</text>
  <text x="540" y="452" text-anchor="middle" class="small">keep pass/fail traces per class; rerun only the affected slice</text>

  <path d="M915 260 C915 310, 840 330, 800 350" class="line"/>
  <path d="M280 412 C120 412, 110 185, 30 185" class="line"/>
  <text x="140" y="525" text-anchor="start" class="small">Update the item set, harness, or model from stable failures; run the next round</text>
</svg>
